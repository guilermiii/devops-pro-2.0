name: primeira-pipeline
on:
  push:
    branches: ["main"]
  workflow_dispatch: # permite executar manualmente no painel esse workflow
jobs:
  primeiro-job:
    name: "Meu primeiro Job"
    runs-on: ubuntu-latest # tem linux/macos/windows/self-hosted
    steps: # passos de execucao, aqui entra as actions
      - name: "Minha primeira ação"
        run: echo "Hello World!"
      - name: "Minha segunda ação"
        run: | # esse cara me permite escrever mais de um comando.
          echo "Criei o meu primeiro Workflow"
          echo "foi muito legal!!!!!"
      - name: "script Python"
        run: |
          variavel = "Hello World in Python"
          print (variavel)
        shell: python
  segundo-job:
    name: "Instalação do ambiente node js"
    runs-on: ubuntu-latest
    steps:
      - name: "verificacao da versao atual"
        run: node --version
      - name: "action setup node enviorement"
      - uses: actions/setup-node@v7.1.0
        with:
          # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
          node-version: '20.13.1'
      - name: "versao do node js depois de instalar"
        run: node --version
