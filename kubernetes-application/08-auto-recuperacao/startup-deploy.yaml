apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulador-do-caos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulador-do-caos
  strategy: {}
  template:
    metadata:
      labels:
        app: simulador-do-caos
    spec:
      containers:
      - image: kubedevio/simulador-do-caos:v1
        name: simulador-do-caos
        ports:
        - containerPort: 3000
        startupProbe:
          httpGet:
            port: 3000
            path: /health
          periodSeconds: 5
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: simulador-do-caos
spec:
  selector:
    app: simulador-do-caos
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    name: http
    protocol: TCP
    nodePort: 30000

